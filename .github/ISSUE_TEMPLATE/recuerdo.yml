name: Dejar un recuerdo
description: Envía una felicitación para el muro público de MIRYAM 25
title: "Recuerdo para Miryam — "
labels: ["pendiente"]
body:
  - type: markdown
    attributes:
      value: |
        Tu aportación será revisada antes de aparecer públicamente. No escribas teléfonos, correos ni otros datos privados.
  - type: input
    id: nombre
    attributes:
      label: Tu nombre
      placeholder: Tu nombre
    validations:
      required: true
  - type: dropdown
    id: para
    attributes:
      label: Se lo dedicas a
      options:
        - Miryam
        - Gloria
        - Joaquín
        - Toda la familia
    validations:
      required: true
  - type: textarea
    id: texto
    attributes:
      label: Felicitación
      placeholder: Escribe aquí tu felicitación
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Foto o vídeo (opcional)
      description: Arrastra aquí una imagen o un vídeo, o usa el selector de archivos de GitHub.
  - type: markdown
    attributes:
      value: "<!-- solicitud-muro-miryam25 -->"
