name: Publicar recuerdo aprobado

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: publicar-muro
  cancel-in-progress: false

jobs:
  publicar:
    if: github.event.label.name == 'publicar' && contains(github.event.issue.body, '### Tu nombre') && contains(github.event.issue.body, '### Felicitación')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Construir entrada
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/publicar-issue.py
      - name: Validar muro
        run: python3 scripts/validar-muro.py
      - name: Publicar si hay cambios
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "celebra-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add muro.json muro-media
          git commit -m "Publicar recuerdo aprobado #${{ github.event.issue.number }}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Confirmar publicación
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: 'Aprobado y publicado. Estará visible en el muro cuando termine el despliegue de GitHub Pages.'
            });
            await github.rest.issues.update({
              ...context.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
