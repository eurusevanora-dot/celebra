<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIRYAM · twenty five</title>
<meta property="og:title" content="MIRYAM · twenty five">
<meta property="og:description" content="19 · 09 · 2026 · Hay mucho que celebrar">
<meta property="og:image" content="https://eurusevanora-dot.github.io/celebra/muro-media/Prueba-foto-20260910-0019.jpg">
<meta property="og:url" content="https://eurusevanora-dot.github.io/celebra/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf8f4;color:#111;font-family:"Cormorant Garamond",Georgia,serif}
.wrap{max-width:980px;margin:0 auto;padding:2.4rem 1.2rem 4rem}
header{text-align:center}
.name{font-size:clamp(2.2rem,7vw,3.6rem);letter-spacing:.28em;margin:0}
.script{font-family:"Great Vibes",cursive;font-size:clamp(2rem,7vw,3rem);margin:.25rem 0}
.caps{letter-spacing:.2em;font-size:clamp(1.2rem,4vw,1.8rem)}
.rule{width:48px;height:1px;background:#111;margin:1rem auto}
.date{letter-spacing:.28em}
.intro{max-width:36rem;margin:1rem auto 1.4rem;line-height:1.5;font-size:1.15rem;text-align:center}
nav{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin:1rem 0 1.6rem}
nav button{background:#fff;border:1px solid #111;font-family:inherit;letter-spacing:.12em;text-transform:uppercase;font-size:.72rem;padding:.65rem 1rem;cursor:pointer}
nav button.on{background:#111;color:#fff}
section{display:none}section.on{display:block}
.grid{columns:3 16rem;column-gap:1rem}
.card{break-inside:avoid;background:#fff;margin:0 0 1rem;padding:.6rem;box-shadow:0 2px 14px #00000012}
.card img,.card video{width:100%;display:block}
.form{max-width:28rem;margin:0 auto;background:#fff;padding:1.2rem;box-shadow:0 2px 14px #00000012}
label{display:block;margin:.7rem 0 .25rem}
input,textarea,select{width:100%;font:inherit;padding:.55rem;border:1px solid #ccc}
textarea{min-height:110px}
.btn{margin-top:1rem;background:#111;color:#fff;border:0;padding:.8rem 1.1rem;letter-spacing:.12em;text-transform:uppercase;font-size:.72rem;font-family:inherit;cursor:pointer;width:100%}
.empty{text-align:center;color:#666}
.who{margin:.5rem .2rem 0}
iframe.hid{position:fixed;left:-9999px;width:1px;height:1px;border:0}
</style>
</head>
<body>
<iframe class="hid" name="envio" title=""></iframe>
<div class="wrap">
<header>
  <p class="name">MIRYAM</p>
  <p class="script">twenty five</p>
  <p class="script">¡Hay mucho que</p>
  <p class="caps">CELEBRAR!</p>
  <div class="rule"></div>
  <p class="date">19 · 09 · 2026</p>
</header>
<p class="intro">Gloria, Miryam, Joaquín, familia y amigos. Deja tu felicitación, foto o vídeo y se publicará en el muro.</p>
<nav>
  <button class="on" data-tab="muro">Muro</button>
  <button data-tab="fotos">Fotos</button>
  <button data-tab="mensajes">Mensajes</button>
  <button data-tab="libre">Espacio libre</button>
</nav>
<section id="muro" class="on">
  <div id="feed" class="grid"></div>
  <p id="empty" class="empty">Aún no hay recuerdos publicados.</p>
</section>
<section id="fotos"><div class="form" data-tipo="Foto" data-file="1"></div></section>
<section id="mensajes"><div class="form" data-tipo="Mensaje"></div></section>
<section id="libre"><div class="form" data-tipo="Espacio libre"></div></section>
</div>
<script>
const API = "https://api.telegram.org/bot8896535636:AAFgj6XD_r91t_pI2_0TyGBHRpCNkMclFLQ";
const CHAT = "1891984663";
function hidden(form, name, value) {
  let i = form.querySelector('input[name="' + name + '"]');
  if (!i) { i = document.createElement("input"); i.type = "hidden"; i.name = name; form.appendChild(i); }
  i.value = value;
}
document.querySelectorAll(".form").forEach(box => {
  const fileField = box.dataset.file ? `<label>Foto o vídeo</label><input name="media" type="file" accept="image/*,video/*" capture="environment">` : "";
  box.innerHTML = `<form method="post" target="envio" enctype="multipart/form-data">
    <label>Tu nombre</label><input name="nombre" required>
    <label>Para</label>
    <select name="para"><option>Miryam</option><option>Gloria</option><option>Joaquín</option><option>Toda la familia</option></select>
    <label>Texto</label><textarea name="mensaje" required></textarea>
    ${fileField}
    <button class="btn" type="submit">Enviar felicitación</button>
  </form>`;
  box.querySelector("form").addEventListener("submit", e => {
    e.preventDefault();
    const f = e.target;
    const caption = "Felicidades Miryam\n" + box.dataset.tipo + " para " + f.para.value + "\nDe: " + f.nombre.value.trim() + "\n" + f.mensaje.value.trim();
    const media = f.media && f.media.files && f.media.files[0];
    hidden(f, "chat_id", CHAT);
    f.target = "envio";
    f.method = "POST";
    if (media) {
      const isVid = (media.type || "").indexOf("video") === 0;
      f.enctype = "multipart/form-data";
      f.action = API + (isVid ? "/sendVideo" : "/sendPhoto");
      f.media.name = isVid ? "video" : "photo";
      hidden(f, "caption", caption);
    } else {
      f.enctype = "application/x-www-form-urlencoded";
      f.action = API + "/sendMessage";
      hidden(f, "text", caption);
    }
    f.submit();
    setTimeout(() => { location.href = "gracias.html"; }, 400);
  });
});
document.querySelectorAll("nav button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("nav button,section").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    document.getElementById(b.dataset.tab).classList.add("on");
  };
});
fetch("muro.json").then(r => r.ok ? r.json() : []).then(items => {
  const feed = document.getElementById("feed");
  const empty = document.getElementById("empty");
  if (!items || !items.length) return;
  empty.hidden = true;
  feed.innerHTML = items.map(p => {
    const src = p.archivo ? "muro-media/" + p.archivo : "";
    const media = p.tipo === "video" && src ? `<video src="${src}" controls></video>` : (src ? `<img src="${src}" alt="">` : "");
    const txt = p.texto ? `<div>${String(p.texto).replace(/</g,"")}</div>` : "";
    return `<article class="card">${media}${txt}<p class="who">${p.nombre || ""}</p></article>`;
  }).join("");
}).catch(()=>{});
</script>
</body>
</html>
