<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Invitación · Myrian’s Family</title>
  <meta name="description" content="19 · 09 · 2026 · Hay mucho que celebrar con Myrian’s Family.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Myrian’s Family · Invitación">
  <meta property="og:description" content="19 · 09 · 2026 · Hay mucho que celebrar. Entra y deja tu recuerdo.">
  <meta property="og:url" content="https://eurusevanora-dot.github.io/celebra/invitacion.html">
  <meta property="og:image" content="https://eurusevanora-dot.github.io/celebra/assets/invitacion-miryam-25.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="720">
  <meta property="og:image:alt" content="Invitación floral Myrian’s Family, 19 de septiembre de 2026">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{display:grid;place-items:center;padding:24px;background:#eadbc6;color:#34271d;font-family:"Cormorant Garamond",Georgia,serif}
    .card{position:relative;isolation:isolate;width:min(100%,1100px);min-height:min(77vw,580px);display:grid;place-items:center;overflow:hidden;background:#f7ead7;box-shadow:0 24px 70px #4b2d172e;border:1px solid #fff9}
    .backdrop{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover}
    .card::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at center,#fffaf0f2 0%,#fff7e4d9 38%,#fff7e466 57%,transparent 72%)}
    main{text-align:center;width:min(64%,650px);padding:56px 18px}
    .eyebrow{margin:0 0 8px;letter-spacing:.42em;font-size:clamp(.72rem,1.8vw,1rem);font-weight:600}
    h1{font-family:"Great Vibes",cursive;font-weight:400;font-size:clamp(3.2rem,7.5vw,5.8rem);line-height:.95;margin:0;color:#9a5960;text-shadow:0 2px 0 #fff8;white-space:nowrap}
    .twenty{font-family:"Great Vibes",cursive;font-size:clamp(2rem,5vw,3.7rem);margin:-4px 0 14px;color:#594237}
    .rule{width:52px;height:1px;background:#b58b42;margin:18px auto}
    .celebrar{font-size:clamp(1.35rem,3.2vw,2.3rem);letter-spacing:.13em;text-transform:uppercase;margin:0}
    .date{font-size:clamp(1rem,2.3vw,1.45rem);letter-spacing:.32em;margin:17px 0 26px}
    .cta{display:inline-block;color:#fffaf0;background:#34271d;text-decoration:none;text-transform:uppercase;letter-spacing:.18em;font-size:.82rem;padding:13px 22px;border:1px solid #34271d;transition:.2s ease}
    .cta:hover,.cta:focus{background:#9a5960;border-color:#9a5960}
    .note{margin:13px 0 0;font-size:1rem}
    @media(max-width:620px){body{padding:0}.card{width:100%;min-height:100vh;background-position:center}.card::before{inset:10% 1%}main{width:82%;padding:48px 8px}.eyebrow{letter-spacing:.28em}}
  </style>
</head>
<body>
  <article class="card">
    <img class="backdrop" src="assets/invitacion-fondo.png" alt="" aria-hidden="true">
    <main>
      <p class="eyebrow">ESTÁS INVITADO A CELEBRAR</p>
      <h1>Myrian’s Family</h1>
      <p class="twenty">twenty five</p>
      <div class="rule"></div>
      <p class="celebrar">Hay mucho que celebrar</p>
      <p class="date">19 · 09 · 2026</p>
      <a class="cta" href="./">Entrar y dejar un recuerdo</a>
      <p class="note">Tu felicitación formará parte de un muro público para la familia.</p>
    </main>
  </article>
</body>
</html>
